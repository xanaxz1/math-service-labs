<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Математический сервис - Прототип</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        button { padding: 10px 20px; cursor: pointer; }
        #result { margin-top: 20px; font-family: monospace; color: green; }
    </style>
</head>
<body>
    <h1>Вычислительный веб-сервис</h1>
    <p><b>Статус прототипа:</b> Базовые компоненты архитектуры развернуты.</p>
    
    <button onclick="testBackend()">Проверить связь с Бэкендом и БД</button>
    
    <pre id="result"></pre>

    <script>
        // Сетевое взаимодействие с бэкендом
        async function testBackend() {
            const response = await fetch('/api/test_db', { method: 'POST' });
            const data = await response.json();
            document.getElementById('result').innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
